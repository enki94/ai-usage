name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-15
            label: macos-universal
            target: universal-apple-darwin
          - os: ubuntu-22.04
            label: linux-x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsecret-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run fmt -- --check
      - run: npm run test:rust -- --locked
      - name: Build native packages
        run: npm run build -- --target ${{ matrix.target }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ai-usage-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
