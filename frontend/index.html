<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Usage</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body>
<div class="app">
 <header class="header"><div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i></div><div><h1>AI Usage</h1><p>AI 서비스 한도를 한눈에</p></div></div><button id="refresh" class="refresh" type="button"><span class="refresh-icon" aria-hidden="true">↻</span> 새로고침</button></header>
 <div class="overview"><span class="eyebrow">USAGE OVERVIEW</span><span id="status" class="live"><i></i>조회 준비 중</span></div>
 <section class="summary" aria-label="서비스별 대표 사용률" id="summary"></section>
 <main class="cards"><div id="left" class="column"></div><div id="right" class="column"></div></main>
 <div id="notice" class="notice" role="status" hidden></div>
 <footer>
  <div class="settings-row"><label for="selection">트레이 표시<select id="selection"><option value="all">모두</option><option value="claude">Claude</option><option value="codex">Codex</option><option value="antigravity">Antigravity</option></select></label><label for="interval">자동 새로고침<select id="interval"><option value="0">안함</option><option value="600">10분</option><option value="3600">1시간</option></select></label></div>
  <div class="bottom-row"><label class="startup"><input type="checkbox" id="startup"><span>로그인 시 실행</span></label><span class="tray-hint">창을 닫아도 트레이에서 실행됩니다</span><button class="quit" id="quit" type="button">종료</button></div>
 </footer>
</div>
</body></html>
