[package]
name = "ai-usage"
version = "0.1.0"
description = "Cross-platform tray monitor for Claude, Codex and Antigravity"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "time", "sync", "rt", "macros", "process"] }
base64 = "0.22"
dirs = "6"
futures = "0.3"
